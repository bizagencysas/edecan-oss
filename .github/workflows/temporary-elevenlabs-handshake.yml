name: Temporary encrypted ElevenLabs handshake

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temporary-elevenlabs-handshake.yml

permissions:
  contents: write

jobs:
  handshake:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Run encrypted one-time operation
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HANDSHAKE_BRANCH: tmp/elevenlabs-handshake-20260805
        shell: bash
        run: |
          set -euo pipefail

          workdir="$(mktemp -d)"
          repodir="$workdir/repo"
          mkdir -p "$repodir"
          trap 'rm -rf "$workdir"' EXIT

          openssl genpkey \
            -algorithm RSA \
            -pkeyopt rsa_keygen_bits:3072 \
            -out "$workdir/private.pem" \
            >/dev/null 2>&1
          openssl pkey \
            -in "$workdir/private.pem" \
            -pubout \
            -out "$workdir/public.pem" \
            >/dev/null 2>&1

          cd "$repodir"
          git init --quiet
          git config user.name "temporary-encrypted-operator"
          git config user.email "actions@users.noreply.github.com"
          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git switch --orphan "$HANDSHAKE_BRANCH"
          mkdir -p handshake
          cp "$workdir/public.pem" handshake/public.pem
          cat > handshake/status.json <<'JSON'
          {
            "status": "awaiting_encrypted_request",
            "protocol": "rsa-oaep-sha256+aes-256-cbc-pbkdf2",
            "operation": "elevenlabs-agent-create"
          }
          JSON
          git add handshake/public.pem handshake/status.json
          git commit --quiet -m "chore: publish ephemeral handshake public key"
          git push --quiet --force origin "HEAD:${HANDSHAKE_BRANCH}"

          request_ready=false
          for _ in $(seq 1 150); do
            git fetch --quiet origin "$HANDSHAKE_BRANCH"
            git reset --quiet --hard FETCH_HEAD
            if [[ -s handshake/key.b64 && -s handshake/request.b64 ]]; then
              request_ready=true
              break
            fi
            sleep 4
          done
          if [[ "$request_ready" != "true" ]]; then
            echo "Encrypted request was not received."
            exit 1
          fi

          base64 --decode handshake/key.b64 > "$workdir/key.enc"
          base64 --decode handshake/request.b64 > "$workdir/request.enc"

          openssl pkeyutl \
            -decrypt \
            -inkey "$workdir/private.pem" \
            -in "$workdir/key.enc" \
            -out "$workdir/passphrase.txt" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256

          openssl enc \
            -decrypt \
            -aes-256-cbc \
            -pbkdf2 \
            -iter 200000 \
            -in "$workdir/request.enc" \
            -out "$workdir/request.json" \
            -pass file:"$workdir/passphrase.txt"

          REQUEST_PATH="$workdir/request.json" \
          RESULT_PATH="$workdir/result.json" \
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import copy
          import json
          import os
          from pathlib import Path
          from typing import Any
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          BASE_URL = "https://api.elevenlabs.io"
          MARKER = "DATACRED_JOSH_MORETTI_FINANCIAL_AGENT_V1"


          def call(
              method: str,
              path: str,
              api_key: str,
              *,
              payload: dict[str, Any] | None = None,
              query: dict[str, str] | None = None,
          ) -> dict[str, Any]:
              url = f"{BASE_URL}{path}"
              if query:
                  url = f"{url}?{urlencode(query)}"
              body = None
              headers = {"Accept": "application/json", "xi-api-key": api_key}
              if payload is not None:
                  body = json.dumps(payload, ensure_ascii=False).encode("utf-8")
                  headers["Content-Type"] = "application/json"

              request = Request(url, data=body, headers=headers, method=method)
              try:
                  with urlopen(request, timeout=60) as response:
                      raw = response.read().decode("utf-8")
              except HTTPError as exc:
                  detail = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(
                      f"ElevenLabs {method} {path} returned HTTP "
                      f"{exc.code}: {detail[:4000]}"
                  ) from exc
              except URLError as exc:
                  raise RuntimeError(
                      f"ElevenLabs {method} {path} could not connect: {exc}"
                  ) from exc

              parsed = json.loads(raw) if raw else {}
              if not isinstance(parsed, dict):
                  raise RuntimeError(
                      f"ElevenLabs {method} {path} returned a non-object response"
                  )
              return parsed


          def score_source(agent: dict[str, Any]) -> int:
              config = agent.get("conversation_config") or {}
              agent_config = config.get("agent") or {}
              prompt = str((agent_config.get("prompt") or {}).get("prompt") or "")
              language = str(agent_config.get("language") or "").lower()
              tts_model = str(
                  (config.get("tts") or {}).get("model_id") or ""
              ).lower()

              score = len(prompt) // 1000
              if language.startswith("es"):
                  score += 100
              if "datacred" in prompt.lower():
                  score += 40
              if "multilingual" in tts_model or "v2_5" in tts_model:
                  score += 20
              if (config.get("asr") or {}).get("quality") == "high":
                  score += 10
              return score


          def prepare_config(
              source_agent: dict[str, Any],
              *,
              voice_id: str,
              first_message: str,
              system_prompt: str,
          ) -> dict[str, Any]:
              config = copy.deepcopy(source_agent.get("conversation_config") or {})
              agent_config = config.setdefault("agent", {})
              prompt_config = agent_config.setdefault("prompt", {})
              tts_config = config.setdefault("tts", {})

              agent_config["first_message"] = first_message
              agent_config["language"] = "es"
              agent_config["disable_first_message_interruptions"] = False
              prompt_config["prompt"] = system_prompt
              prompt_config["temperature"] = 0.25
              prompt_config["max_tokens"] = 1200

              for key in (
                  "tool_ids",
                  "tools",
                  "knowledge_base",
                  "knowledge_base_ids",
                  "mcp_server_ids",
                  "native_mcp_server_ids",
              ):
                  prompt_config.pop(key, None)

              built_in_tools = prompt_config.get("built_in_tools")
              if isinstance(built_in_tools, dict):
                  prompt_config["built_in_tools"] = {
                      key: value
                      for key, value in built_in_tools.items()
                      if key == "end_call"
                  }

              if "language_presets" in config:
                  config["language_presets"] = {}

              tts_config["voice_id"] = voice_id
              if "speed" in tts_config:
                  tts_config["speed"] = 0.97
              if "stability" in tts_config:
                  tts_config["stability"] = 0.5
              if "similarity_boost" in tts_config:
                  tts_config["similarity_boost"] = 0.8

              conversation = config.setdefault("conversation", {})
              if "max_duration_seconds" in conversation:
                  conversation["max_duration_seconds"] = max(
                      int(conversation.get("max_duration_seconds") or 0),
                      1800,
                  )
              return config


          def find_existing(
              api_key: str,
              *,
              name: str,
              voice_id: str,
          ) -> dict[str, Any] | None:
              listing = call(
                  "GET",
                  "/v1/convai/agents",
                  api_key,
                  query={
                      "page_size": "100",
                      "search": name,
                      "show_only_owned_agents": "true",
                  },
              )
              for summary in listing.get("agents") or []:
                  if summary.get("name") != name:
                      continue
                  agent_id = summary.get("agent_id")
                  if not agent_id:
                      continue
                  agent = call(
                      "GET",
                      f"/v1/convai/agents/{agent_id}",
                      api_key,
                  )
                  config = agent.get("conversation_config") or {}
                  prompt = str(
                      (
                          ((config.get("agent") or {}).get("prompt") or {}).get(
                              "prompt"
                          )
                          or ""
                      )
                  )
                  configured_voice = (config.get("tts") or {}).get("voice_id")
                  if MARKER in prompt and configured_voice == voice_id:
                      return agent
              return None


          request_data = json.loads(
              Path(os.environ["REQUEST_PATH"]).read_text(encoding="utf-8")
          )
          api_key = base64.b64decode(
              request_data["api_key_b64"]
          ).decode("utf-8")
          print(f"::add-mask::{api_key}")

          sources = [
              call("GET", f"/v1/convai/agents/{agent_id}", api_key)
              for agent_id in request_data["source_agent_ids"]
          ]
          source_summary = []
          for source in sources:
              config = source.get("conversation_config") or {}
              agent_config = config.get("agent") or {}
              prompt_config = agent_config.get("prompt") or {}
              source_summary.append(
                  {
                      "agent_id": source.get("agent_id"),
                      "name": source.get("name"),
                      "language": agent_config.get("language"),
                      "llm": prompt_config.get("llm"),
                      "voice_id": (config.get("tts") or {}).get("voice_id"),
                      "first_message": agent_config.get("first_message"),
                      "prompt_length": len(
                          str(prompt_config.get("prompt") or "")
                      ),
                      "mentions_datacred": (
                          "datacred"
                          in str(prompt_config.get("prompt") or "").lower()
                      ),
                  }
              )

          base_agent = max(sources, key=score_source)

          try:
              voice = call(
                  "GET",
                  f"/v1/voices/{request_data['voice_id']}",
                  api_key,
              )
              voice_summary: dict[str, Any] = {
                  "voice_id": voice.get("voice_id")
                  or request_data["voice_id"],
                  "name": voice.get("name"),
                  "category": voice.get("category"),
              }
          except RuntimeError as exc:
              voice_summary = {
                  "voice_id": request_data["voice_id"],
                  "lookup_warning": str(exc),
              }

          final_agent = find_existing(
              api_key,
              name=request_data["name"],
              voice_id=request_data["voice_id"],
          )
          created_now = final_agent is None

          if final_agent is None:
              payload = {
                  "name": request_data["name"],
                  "tags": request_data["tags"],
                  "conversation_config": prepare_config(
                      base_agent,
                      voice_id=request_data["voice_id"],
                      first_message=request_data["first_message"],
                      system_prompt=request_data["system_prompt"],
                  ),
              }
              created = call(
                  "POST",
                  "/v1/convai/agents/create",
                  api_key,
                  payload=payload,
              )
              agent_id = created.get("agent_id")
              if not agent_id:
                  raise RuntimeError(
                      "ElevenLabs returned no agent_id after creation"
                  )
              final_agent = call(
                  "GET",
                  f"/v1/convai/agents/{agent_id}",
                  api_key,
              )

          final_config = final_agent.get("conversation_config") or {}
          final_agent_config = final_config.get("agent") or {}
          final_prompt_config = final_agent_config.get("prompt") or {}
          result = {
              "status": "success",
              "created_now": created_now,
              "agent_id": final_agent.get("agent_id"),
              "name": final_agent.get("name"),
              "language": final_agent_config.get("language"),
              "voice": voice_summary,
              "configured_voice_id": (
                  final_config.get("tts") or {}
              ).get("voice_id"),
              "tts_model_id": (
                  final_config.get("tts") or {}
              ).get("model_id"),
              "llm": final_prompt_config.get("llm"),
              "first_message": final_agent_config.get("first_message"),
              "system_prompt_length": len(
                  str(final_prompt_config.get("prompt") or "")
              ),
              "source_agents": source_summary,
              "base_agent_id": base_agent.get("agent_id"),
              "tags": final_agent.get("tags"),
          }

          if result["name"] != request_data["name"]:
              raise RuntimeError(
                  f"Unexpected agent name: {result['name']!r}"
              )
          if result["configured_voice_id"] != request_data["voice_id"]:
              raise RuntimeError(
                  "Created agent voice did not match the requested voice"
              )
          if result["language"] != "es":
              raise RuntimeError(
                  f"Unexpected agent language: {result['language']!r}"
              )
          if MARKER not in str(final_prompt_config.get("prompt") or ""):
              raise RuntimeError(
                  "Created agent system prompt marker was not persisted"
              )

          Path(os.environ["RESULT_PATH"]).write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(
              "ELEVENLABS_RESULT_JSON="
              + json.dumps(result, ensure_ascii=False, sort_keys=True)
          )
          PY

          cp "$workdir/result.json" handshake/result.json
          cat > handshake/status.json <<'JSON'
          {
            "status": "operation_complete",
            "operation": "elevenlabs-agent-create"
          }
          JSON
          git add handshake/result.json handshake/status.json
          git commit --quiet -m "chore: publish encrypted-operation result"
          git push --quiet origin "HEAD:${HANDSHAKE_BRANCH}"

          acknowledged=false
          for _ in $(seq 1 90); do
            git fetch --quiet origin "$HANDSHAKE_BRANCH"
            git reset --quiet --hard FETCH_HEAD
            if [[ -s handshake/ack.txt ]]; then
              acknowledged=true
              break
            fi
            sleep 4
          done

          if [[ "$acknowledged" == "true" ]]; then
            git push --quiet origin --delete "$HANDSHAKE_BRANCH"
          else
            echo "Result was not acknowledged; encrypted branch left for cleanup."
          fi
