# project.yml — proyecto Xcode de Edecán generado con xcodegen.
#
# NUNCA se edita `Edecan.xcodeproj` a mano ni se versiona (ver `.gitignore`
# en este mismo directorio): este archivo es la única fuente de verdad del
# proyecto. Cualquier cambio de targets/settings va aquí.
#
# Pipeline conocido (mismo patrón que el dueño ya usa en sus otros proyectos
# iOS, ver `docs/movil-ios.md` y `fastlane/Fastfile`):
#   1. Bump de versión: subir `CURRENT_PROJECT_VERSION` abajo (o correr
#      `fastlane bump`, que hace el mismo `sed`).
#   2. `xcodegen generate` — regenera `Edecan.xcodeproj` desde este archivo.
#   3. `LC_ALL=en_US.UTF-8 fastlane adhoc` — build + firma ad-hoc con la
#      cuenta Apple Developer del CLIENTE (nunca la del dueño de Edecán).
#
# NOTA IMPORTANTE sobre el bundle id: `cc.edecan.app` de abajo es un
# PLACEHOLDER de desarrollo. Cada CLIENTE que compile esta app debe
# cambiarlo por uno propio (ej. `com.tuempresa.edecan`) antes de firmar con
# su cuenta Apple Developer — un bundle id no se puede repetir entre cuentas
# distintas. Ver `docs/movil-ios.md` sección "Antes de compilar".

name: Edecan

options:
  bundleIdPrefix: cc.edecan
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  # Swift 6 estricto en todo el proyecto (concurrencia completa) — mismo
  # criterio que EdecanKit/Package.swift.
  transitivelyLinkDependencies: true

settings:
  base:
    CURRENT_PROJECT_VERSION: "123"
    MARKETING_VERSION: "0.9.15"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad
    ENABLE_PREVIEWS: "YES"
    DEVELOPMENT_TEAM: "" # cada cliente pone SU Team ID aquí o en Xcode ->
    # Signing & Capabilities. Ver docs/movil-ios.md. NUNCA un Team ID real
    # va en este repo (ARCHITECTURE.md §0 — cero secretos/credenciales
    # reales).
    CODE_SIGN_STYLE: Automatic
    # Canal público de actualización. Son valores de compilación, no secretos.
    # Un fork puede reemplazarlos desde Xcode o la línea de comandos sin
    # modificar Swift:
    #   EDECAN_IOS_UPDATE_CHANNEL=preview
    #   EDECAN_IOS_UPDATE_MANIFEST_URL=https://.../ios-preview.json
    EDECAN_IOS_UPDATE_CHANNEL: stable
    EDECAN_IOS_UPDATE_MANIFEST_URL: "https://raw.githubusercontent.com/your-org/edecan-oss/update-channels/ios-stable.json"
    # Placeholder neutral que cada instalación puede sustituir desde CLI:
    #   EDECAN_IOS_BUNDLE_ID=com.suempresa.edecan
    # Mantiene sincronizados el app principal y sus extensiones sin editar
    # este archivo ni publicar identificadores privados en el OSS.
    EDECAN_IOS_BUNDLE_ID: cc.edecan.app

packages:
  EdecanKit:
    path: EdecanKit

targets:
  EdecanApp:
    type: application
    platform: iOS
    sources:
      - path: EdecanApp
        excludes:
          - "**/*.md"
    resources:
      - path: EdecanApp/Resources
    info:
      path: EdecanApp/Info.plist
      properties:
        CFBundleDisplayName: Edecán
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        EdecanUpdateChannel: "$(EDECAN_IOS_UPDATE_CHANNEL)"
        EdecanUpdateManifestURL: "$(EDECAN_IOS_UPDATE_MANIFEST_URL)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: "Edecan necesita el micrófono para escuchar tus solicitudes por voz desde el chat."
        NSCameraUsageDescription: "Edecán usa la cámara para escanear el QR de conexión y para adjuntar fotos que tú decidas enviar en el chat."
        NSPhotoLibraryUsageDescription: "Edecán accede únicamente a las fotos que tú elijas para adjuntarlas en el chat."
        NSLocalNetworkUsageDescription: "Edecán usa tu red local para conectarse de forma directa y privada con tu computador después de escanear su QR."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSSpeechRecognitionUsageDescription: "Edecan usa el reconocimiento de voz del dispositivo para convertir tus solicitudes en texto sin exigir una clave externa."
        NSHealthShareUsageDescription: "Edecán lee tus entrenamientos, pasos y agua de Salud para mostrarte tu actividad del día y guardar la sesión de gimnasio que terminas."
        NSHealthUpdateUsageDescription: "Edecán guarda en Salud el agua que registras y el entrenamiento de fuerza que terminas."
        CFBundleURLTypes:
          - CFBundleURLName: cc.edecan.pairing
            CFBundleURLSchemes:
              - edecan
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(EDECAN_IOS_BUNDLE_ID)"
        # El ejecutable y el bundle usan ASCII para que codesign no trate el
        # binario principal como un recurso bajo distintas normalizaciones de
        # filesystem. El nombre que ve la persona sigue siendo "Edecán" por
        # CFBundleDisplayName, arriba.
        PRODUCT_NAME: Edecan
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
      configs:
        # Los equipos personales de Apple permiten instalar Edecán por USB,
        # pero no pueden firmar APNs. Debug usa por eso un entitlement local
        # vacío; Release conserva Push Notifications para quien conecte su
        # propia cuenta Apple Developer de pago.
        Debug:
          CODE_SIGN_ENTITLEMENTS: EdecanApp/EdecanApp.local.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: EdecanApp/EdecanApp.entitlements
    dependencies:
      - package: EdecanKit
      - target: EdecanWidgetsExtension
      - target: EdecanShareExtension
      - target: EdecanWatchApp

  EdecanWidgetsExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: EdecanWidgets
    info:
      path: EdecanWidgets/Info.plist
      properties:
        CFBundleDisplayName: Edecán Widgets
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(EDECAN_IOS_BUNDLE_ID).widgets"
        PRODUCT_NAME: EdecanWidgets
        SKIP_INSTALL: "YES"
        CODE_SIGN_ENTITLEMENTS: EdecanWidgets/EdecanWidgets.entitlements
    dependencies:
      - package: EdecanKit

  EdecanShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: EdecanShareExtension
    info:
      path: EdecanShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Compartir con Edecán
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURL: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(EDECAN_IOS_BUNDLE_ID).share"
        PRODUCT_NAME: EdecanShare
        SKIP_INSTALL: "YES"
        CODE_SIGN_ENTITLEMENTS: EdecanShareExtension/EdecanShareExtension.entitlements
    dependencies:
      - package: EdecanKit

  # ── Apple Watch (scaffold) ──────────────────────────────────────────────
  # App del Watch y su extensión (SwiftUI + WatchConnectivity). El Watch NO
  # enlaza EdecanKit: todavía no tiene acceso a la red — el estado de la
  # sesión de gym viaja del iPhone al Watch por mensajes WatchConnectivity
  # (`PhoneWatchBridge` en EdecanApp → `WatchSessionManager` en la
  # extensión). Bundle ids derivados de `$(EDECAN_IOS_BUNDLE_ID)` (mismo
  # mecanismo que `.widgets`/`.share`): con el default del instalador
  # (`EDECAN_IOS_BUNDLE_ID=org.example.edecan`, ver
  # `scripts/install_device.sh`) quedan en
  # `org.example.edecan.watchkitapp` y
  # `org.example.edecan.watchkitapp.watchkitextension`.

  # Apple Watch — SINGLE-TARGET (watchOS 10+, el modelo app+extensión de
  # watchOS 2-9 quedó DEPRECATED por Apple; el product type
  # `watchkit2-extension` ya no se compila). TODO el código vive en
  # `EdecanWatchApp`: las vistas de `EdecanWatchExtension/` (ContentView,
  # WatchSessionManager) se compilan DENTRO de este target, sin extensión
  # separada y sin NSExtension en el Info.plist.
  EdecanWatchApp:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: EdecanWatchApp
        excludes:
          - "**/*.md"
      - path: EdecanWatchExtension
        excludes:
          - "**/*.md"
          - "Info.plist"
    resources:
      - path: EdecanWatchApp/Resources
    info:
      path: EdecanWatchApp/Info.plist
      properties:
        CFBundleDisplayName: Edecán
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # El companion del Watch es el iPhone con la app principal; el valor
        # se resuelve a build-time igual que el bundle id de EdecanApp.
        WKCompanionAppBundleIdentifier: "$(EDECAN_IOS_BUNDLE_ID)"
        # Marca ESTE bundle como app de Watch (single-target): sin esta clave
        # `installd` lo rechaza con "does not have WKApplication key set to
        # true" (MIInstallerErrorDomain 92 InvalidWatchKitApp).
        WKApplication: true
        NSHealthShareUsageDescription: "Edecán lee pasos, ritmo, HRV, sueño, movimiento, pie, oxígeno y agua de Salud en el reloj para el resumen del día y el entrenamiento."
        NSHealthUpdateUsageDescription: "Edecán guarda en Salud el agua, el entrenamiento de gym y los minutos de calma que marcas desde el reloj."
        WKBackgroundModes:
          - workout-processing
        # El App Store valida ambos para apps watch: el PNG físico
        # (`CFBundleIconFiles` + `AppIcon.png` en la raíz) y el asset catalog
        # (`CFBundleIconName`). Ambos presentes, ambos válidos.
        CFBundleIconFiles:
          - AppIcon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(EDECAN_IOS_BUNDLE_ID).watchkitapp"
        PRODUCT_NAME: EdecanWatchApp
        # App icons en asset catalog (CFBundleIconName) + PNG físico (CFBundleIconFiles):
        # el App Store con SDK moderno exige ambos para el watch.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4" # Watch (el base del proyecto usa "1,2")
        SKIP_INSTALL: "YES" # se embebe en Edecan.app, no se instala suelta
        CODE_SIGN_ENTITLEMENTS: EdecanWatchApp/EdecanWatchApp.entitlements
        ENABLE_APP_INTENTS_METADATA_PROCESSING: "NO"
        ENABLE_APP_INTENTS_COMPILE_TIME_EXTRACTION: "NO"
        ENABLE_DEBUG_DYLIB: "NO"
        ONLY_ACTIVE_ARCH: "YES"
    dependencies:
      - target: EdecanWatchWidgets
    scheme: {}

  EdecanWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: EdecanWatchWidgets
        excludes:
          - "**/*.md"
          - "Info.plist"
          - "*.entitlements"
    info:
      path: EdecanWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Edecán
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(EDECAN_IOS_BUNDLE_ID).watchkitapp.widgets"
        PRODUCT_NAME: EdecanWatchWidgets
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "26.0"
        SKIP_INSTALL: "YES"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        CODE_SIGN_ENTITLEMENTS: EdecanWatchWidgets/EdecanWatchWidgets.entitlements
        ENABLE_APP_INTENTS_METADATA_PROCESSING: "NO"
        ENABLE_APP_INTENTS_COMPILE_TIME_EXTRACTION: "NO"
        ENABLE_DEBUG_DYLIB: "NO"
        ONLY_ACTIVE_ARCH: "YES"

  EdecanUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: EdecanUITests
    dependencies:
      - target: EdecanApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(EDECAN_IOS_BUNDLE_ID).uitests"
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: EdecanApp

schemes:
  EdecanApp:
    build:
      targets:
        EdecanApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EdecanUITests
    archive:
      config: Release
