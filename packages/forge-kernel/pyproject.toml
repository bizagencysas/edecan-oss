[project]
name = "edecan-forge-kernel"
version = "0.1.0"
description = "Forge — contratos unificados y reducer puro del kernel (fase 0.5)"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edecan_forge_kernel"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
