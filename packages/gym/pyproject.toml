[project]
name = "edecan-gym"
version = "0.9.0"
description = "Dominio puro del gimnasio inteligente: planes, sesiones, memoria y check-in"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edecan_gym"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]